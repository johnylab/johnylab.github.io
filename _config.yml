---
title: Johnylab
timezone: America/Sao_Paulo
collections:
  posts:
    output: true
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: page
    image: /img/og-image.jpg
- scope:
    path: ''
    type: posts
  values:
    layout: post
    permalink: blog/:title/
lang: en
image: /img/og-image.jpg
description: "I'm João Ferreira, a full stack engineer (React, TypeScript, Node.js and AI/LLM products) based in Santos, SP."
baseurl: ''
url: https://johnylab.com.br
twitter:
  card: summary
social:
  name: João Ferreira
  links:
    - https://www.linkedin.com/in/johnylab/
    - https://github.com/johnylab
markdown: kramdown
permalink: pretty/
paginate: 10
paginate_path: "/blog/:num/"
sass:
  style: compressed
plugins:
- jekyll-paginate
- jekyll-sitemap
exclude:
- ".sass-cache/"
- ".jekyll-cache/"
- gemfiles/
- Gemfile
- Gemfile.lock
- node_modules/
- media-src/
- scripts/
- vendor/bundle/
- vendor/cache/
- vendor/gems/
- vendor/ruby/
- README.md
- package.json
- CNAME
- CLAUDE.md
- docs/
